<body>

<nav>
  <ul>

       <option>Paper</option>
          <option>Scissors</option>

<button type="submit">Play</button>
      </form>

<aside class="sidebar">
      <h3>Rules</h3>
      <p>Rock beats Scissors</p>
      <p>Paper beats Rock</p>
      <p>Scissors beat Paper</p>
    </aside>

  footer class="band">

  </footer>
